# Copy to /etc/nginx/sites-available/yive-relay.conf, replace server_name,
# then symlink it into /etc/nginx/sites-enabled/.
#
# This HTTP-only template is useful before a domain/HTTPS certificate is ready.
# For public testing, prefer nginx-yive-relay-https.conf after Certbot succeeds.

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
